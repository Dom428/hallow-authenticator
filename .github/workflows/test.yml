# Runs the unit tests (RFC vectors, importers, vault, QR reader) on every push - made-up data only. Nothing is released from here.
name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/unit.mjs
